services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: eve_healthcare
      POSTGRES_USER: eve
      POSTGRES_PASSWORD: eve
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eve -d eve_healthcare"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql://eve:eve@db:5432/eve_healthcare
      JWT_SECRET: change-this-in-production
      JWT_EXPIRE_MINUTES: 60
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
